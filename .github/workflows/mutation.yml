on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'psalm.xml'

  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'psalm.xml'

name: mutation test

permissions:
  contents: read

env:
  DLOAD_CACHE_DIR: ${{ github.workspace }}/runtime/dload-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']
        php: ['8.5']

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: memory_limit=-1
          coverage: pcov
          tools: composer:v2
          extensions: grpc-1.56.0 sockets

      - name: Install dependencies with composer.
        run: composer update --no-interaction --no-progress --optimize-autoloader --ansi

      # Release metadata only, no binaries or tokens.
      - name: Restore DLoad version registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/dload-cache
          key: dload-registry-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dload-registry-${{ runner.os }}-

      - name: Get RoadRunner binary
        env:
          # Authenticated requests get a higher GitHub API rate limit than anonymous ones.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vendor/bin/rr get-binary
          cp ./rr /usr/local/bin/rr

      - name: Start RoadRunner
        run: rr -s -w=$(pwd) serve &

      - name: Run infection
        run: vendor/bin/infection --threads=2 --ignore-msi-with-no-mutations
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
